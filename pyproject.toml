[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "information-radar"
version = "0.1.0"
description = "Topic-agnostic early-signal detection for personal intelligence"
requires-python = ">=3.9"

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
