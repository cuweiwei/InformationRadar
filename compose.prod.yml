name: information-radar

services:
  radar-web:
    image: ghcr.io/cuweiwei/information-radar@sha256:dafe6d394d125a0d6d14a51815fd7b5155547b0762399d0edb07219569bd2eea
    command: ["radar", "serve", "--host", "0.0.0.0", "--port", "8787", "--no-demo"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RADAR_HOST_PORT:-8789}:8787"
    environment:
      RADAR_DB: /app/data/radar.db
      RADAR_HTTP_TIMEOUT: ${RADAR_HTTP_TIMEOUT:-15}
      RADAR_TIMEZONE: ${RADAR_TIMEZONE:-Asia/Taipei}
      AIHP_RELEASE_COMMIT: 854c9b59d4521f137712162a898bcd1dd1790ef6
      AIHP_IMAGE_DIGEST: sha256:dafe6d394d125a0d6d14a51815fd7b5155547b0762399d0edb07219569bd2eea
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PRODUCT_HUNT_TOKEN: ${PRODUCT_HUNT_TOKEN:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      HERMES_WEBHOOK_URL: ${HERMES_WEBHOOK_URL:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CONTEXTHUB_BASE_URL: ${CONTEXTHUB_BASE_URL:-}
      CONTEXTHUB_API_KEY: ${CONTEXTHUB_API_KEY:-}
      HERMES_EVENT_URL: ${HERMES_EVENT_URL:-}
      HERMES_EVENT_PATH: ${HERMES_EVENT_PATH:-}
      HERMES_EVENT_API_KEY: ${HERMES_EVENT_API_KEY:-}
      RADAR_PROJECTION_TOKEN: ${RADAR_PROJECTION_TOKEN:-}
    volumes:
      - /volume1/docker/information-radar/data:/app/data
      - /volume1/docker/information-radar/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  radar-job:
    image: ghcr.io/cuweiwei/information-radar@sha256:dafe6d394d125a0d6d14a51815fd7b5155547b0762399d0edb07219569bd2eea
    profiles: ["job"]
    command: ["radar", "run", "ai_tools", "--since", "1d", "--deliver"]
    environment:
      RADAR_DB: /app/data/radar.db
      RADAR_HTTP_TIMEOUT: ${RADAR_HTTP_TIMEOUT:-15}
      RADAR_TIMEZONE: ${RADAR_TIMEZONE:-Asia/Taipei}
      AIHP_RELEASE_COMMIT: 854c9b59d4521f137712162a898bcd1dd1790ef6
      AIHP_IMAGE_DIGEST: sha256:dafe6d394d125a0d6d14a51815fd7b5155547b0762399d0edb07219569bd2eea
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PRODUCT_HUNT_TOKEN: ${PRODUCT_HUNT_TOKEN:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      HERMES_WEBHOOK_URL: ${HERMES_WEBHOOK_URL:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CONTEXTHUB_BASE_URL: ${CONTEXTHUB_BASE_URL:-}
      CONTEXTHUB_API_KEY: ${CONTEXTHUB_API_KEY:-}
      HERMES_EVENT_URL: ${HERMES_EVENT_URL:-}
      HERMES_EVENT_PATH: ${HERMES_EVENT_PATH:-}
      HERMES_EVENT_API_KEY: ${HERMES_EVENT_API_KEY:-}
      RADAR_PROJECTION_TOKEN: ${RADAR_PROJECTION_TOKEN:-}
    volumes:
      - /volume1/docker/information-radar/data:/app/data
      - /volume1/docker/information-radar/logs:/app/logs
