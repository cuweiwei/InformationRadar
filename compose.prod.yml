name: information-radar

services:
  radar-web:
    image: ghcr.io/cuweiwei/information-radar@sha256:44d9cc812c304ae5f8037829d21bc9da66cac7e8b80b05fa0ff3896257fc9f19
    command: ["radar", "serve", "--host", "0.0.0.0", "--port", "8787", "--no-demo"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RADAR_HOST_PORT:-8789}:8787"
    environment:
      RADAR_DB: /app/data/radar.db
      RADAR_HTTP_TIMEOUT: ${RADAR_HTTP_TIMEOUT:-15}
      RADAR_TIMEZONE: ${RADAR_TIMEZONE:-Asia/Taipei}
      AIHP_RELEASE_COMMIT: ${AIHP_RELEASE_COMMIT:-}
      AIHP_IMAGE_DIGEST: ${AIHP_IMAGE_DIGEST:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PRODUCT_HUNT_TOKEN: ${PRODUCT_HUNT_TOKEN:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      HERMES_WEBHOOK_URL: ${HERMES_WEBHOOK_URL:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - /volume1/docker/information-radar/data:/app/data
      - /volume1/docker/information-radar/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      default: {}
      personal-ai-network:
        aliases:
          - information-radar

  radar-job:
    image: ghcr.io/cuweiwei/information-radar@sha256:44d9cc812c304ae5f8037829d21bc9da66cac7e8b80b05fa0ff3896257fc9f19
    profiles: ["job"]
    command: ["radar", "run", "ai_tools", "--since", "1d", "--deliver"]
    environment:
      RADAR_DB: /app/data/radar.db
      RADAR_HTTP_TIMEOUT: ${RADAR_HTTP_TIMEOUT:-15}
      RADAR_TIMEZONE: ${RADAR_TIMEZONE:-Asia/Taipei}
      AIHP_RELEASE_COMMIT: ${AIHP_RELEASE_COMMIT:-}
      AIHP_IMAGE_DIGEST: ${AIHP_IMAGE_DIGEST:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PRODUCT_HUNT_TOKEN: ${PRODUCT_HUNT_TOKEN:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      HERMES_WEBHOOK_URL: ${HERMES_WEBHOOK_URL:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - /volume1/docker/information-radar/data:/app/data
      - /volume1/docker/information-radar/logs:/app/logs

networks:
  default: {}
  personal-ai-network:
    external: true
