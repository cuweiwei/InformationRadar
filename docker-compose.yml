services:
  radar-web:
    image: ${RADAR_IMAGE:?RADAR_IMAGE is required}
    command: ["radar", "serve", "--host", "0.0.0.0", "--port", "8787", "--no-demo"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RADAR_HOST_PORT:-8789}:8787"
    env_file:
      - .env
    environment:
      RADAR_DB: /app/data/radar.db
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./config:/app/config:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  radar-job:
    image: ${RADAR_IMAGE:?RADAR_IMAGE is required}
    profiles: ["job"]
    command: ["radar", "run", "ai_tools", "--since", "1d", "--deliver"]
    env_file:
      - .env
    environment:
      RADAR_DB: /app/data/radar.db
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./config:/app/config:ro
      - ./logs:/app/logs
